[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deskremote"
version = "2.5.0"
description = "Inoffizielle Windows-Tray-Fernbedienung für Teufel Raumfeld"
license = { text = "MIT" }
readme = "README.md"
authors = [{ name = "zabern" }]
requires-python = ">=3.13"
dependencies = ["PySide6>=6.7", "httpx>=0.27", "defusedxml>=0.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "pyinstaller>=6.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
